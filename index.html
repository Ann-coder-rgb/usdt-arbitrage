<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匯差套利終端儀表板 V3.4.2</title>
    
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 18 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 全局 80% 比例縮放與黑銀風格 */
        body {
            background-color: black;
            color: #cbd5e1;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.8rem; 
            margin: 0;
            overflow: hidden; /* 確保全螢幕不產生捲軸 */
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        @keyframes subtle-flash {
            0% { opacity: 1; color: #fff; }
            50% { opacity: 0.7; color: #22d3ee; }
            100% { opacity: 1; color: #fff; }
        }
        .animate-price-flash {
            animation: subtle-flash 0.8s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- 內嵌 SVG 圖示組件 ---
        const IconCpu = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line></svg>
        );
        const IconRefresh = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        );

        const App = () => {
            const [loading, setLoading] = useState(false);
            const [bgSyncing, setBgSyncing] = useState(false);
            const [rates, setRates] = useState({ buy: 31.25, sell: 32.12, updateTime: '--:--' });
            const [bitoPrice, setBitoPrice] = useState(null);
            const [copyFeedback, setCopyFeedback] = useState(null);
            const [bitoTimer, setBitoTimer] = useState(8); 
            const [usdtAmount, setUsdtAmount] = useState(1000); 
            const [feeRate, setFeeRate] = useState(0.2); 
            const [priceFlash, setPriceFlash] = useState(false);

            // API 金鑰
            const apiKey = ""; 

            const fetchWithRetry = async (url, options = {}, retries = 5, backoff = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (retries > 0) {
                        await new Promise(r => setTimeout(r, backoff));
                        return fetchWithRetry(url, options, retries - 1, backoff * 2);
                    }
                    throw err;
                }
            };

            const fetchBotRates = async (isBackground = false) => {
                if (!isBackground) setLoading(true);
                setBgSyncing(true);
                try {
                    const userQuery = "請幫我查詢台灣銀行最新美金現鈔的『買入』與『賣出』匯率數字是多少？";
                    const systemPrompt = "你是一個專業的匯率數據抓取助手。請從搜尋結果中找出台灣銀行的美金現鈔買入與賣出價格。僅回傳一個 JSON 物件，格式如下：{\"buy\": 數字, \"sell\": 數字}。不要包含任何其他文字或解釋。";
                    
                    const result = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ "google_search": {} }]
                        })
                    });

                    const textContent = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    const cleanedJsonText = textContent.replace(/```json|```/g, "").trim();
                    const data = JSON.parse(cleanedJsonText);

                    if (data.buy && data.sell) {
                        setRates({ 
                            buy: data.buy, 
                            sell: data.sell, 
                            updateTime: new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' }) 
                        });
                    } else {
                        throw new Error("回傳格式不正確");
                    }
                } catch (err) { 
                    console.error("數據同步失敗原因:", err); 
                } finally { 
                    setLoading(false);
                    setTimeout(() => setBgSyncing(false), 2000);
                }
            };

            const fetchBitoPrice = useCallback(async () => {
                try {
                    const data = await fetchWithRetry('https://api.bitopro.com/v3/tickers/usdt_twd');
                    if (data?.data?.lastPrice) {
                        const newPrice = parseFloat(data.data.lastPrice);
                        if (newPrice !== bitoPrice) {
                            setPriceFlash(true);
                            setTimeout(() => setPriceFlash(false), 800);
                        }
                        setBitoPrice(newPrice);
                        setBitoTimer(8);
                    }
                } catch (err) { console.error("幣託連線異常:", err); }
            }, [bitoPrice]);

            const calculations = useMemo(() => {
                const mid = (parseFloat(rates.buy) + parseFloat(rates.sell)) / 2;
                const amount = parseFloat(usdtAmount) || 0;
                const feeDecimal = (parseFloat(feeRate) || 0) / 100;
                const baseNet = (mid * amount) * (1 - feeDecimal);

                const levels = [1.01, 1.02, 1.03, 1.04, 1.05, 1.06].map(m => {
                    const targetSellPrice = mid * m;
                    const netTwdFromSell = (targetSellPrice * amount) * (1 - feeDecimal);
                    const breakEvenBuyPrice = targetSellPrice * (1 - feeDecimal) / (1 + feeDecimal);
                    const extraProfit = netTwdFromSell - baseNet;

                    return {
                        label: `${(m * 100 - 100).toFixed(0)}%`,
                        sellPrice: targetSellPrice.toFixed(4),
                        buyBackPrice: breakEvenBuyPrice.toFixed(4),
                        netTwd: Math.round(netTwdFromSell).toLocaleString(),
                        profit: Math.round(extraProfit).toLocaleString()
                    };
                });

                const premium = bitoPrice ? (((bitoPrice / mid) - 1) * 100).toFixed(2) : '--';
                return { mid, levels, baseNet, premium };
            }, [rates, usdtAmount, feeRate, bitoPrice]);

            useEffect(() => {
                fetchBotRates();
                fetchBitoPrice();
                const bitoInterval = setInterval(fetchBitoPrice, 8000);
                const botInterval = setInterval(() => fetchBotRates(true), 120000);
                const countdown = setInterval(() => setBitoTimer(prev => prev > 0 ? prev - 1 : 0), 1000);
                return () => {
                    clearInterval(bitoInterval);
                    clearInterval(botInterval);
                    clearInterval(countdown);
                };
            }, [fetchBitoPrice]);

            const handleCopy = (val) => {
                const el = document.createElement('textarea');
                el.value = val;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopyFeedback(val);
                setTimeout(() => setCopyFeedback(null), 1000);
            };

            // 調整後的統一字體大小：與數量 (USDT) 相同使用 text-sm
            const uniformText = "text-sm font-bold tracking-tight transition-all duration-500 text-center"; 
            const labelText = "text-[10px] md:text-[11px] font-bold text-slate-500 uppercase tracking-widest leading-relaxed text-center"; 

            return (
                <div className="h-screen bg-black text-slate-300 font-mono overflow-hidden p-2 flex flex-col gap-2 selection:bg-silver-500/30">
                    
                    {/* 頂部看板區域 */}
                    <section className="bg-[#111] border border-white/10 rounded-lg p-2 md:p-3 flex items-center justify-between shadow-2xl relative overflow-hidden flex-shrink-0">
                        <div className="absolute bottom-0 left-0 h-[1px] bg-cyan-900 transition-all duration-1000" style={{ width: `${(bitoTimer/8)*100}%` }} />
                        
                        <div className="flex items-center gap-3 border-r border-white/10 pr-4 md:pr-6">
                            <IconCpu className={`w-4 h-4 md:w-5 md:h-5 ${bgSyncing ? 'text-cyan-400' : 'text-silver-400'} transition-colors duration-700`} />
                            <h1 className="text-xs md:text-base font-bold tracking-[0.1em] text-white whitespace-nowrap">匯差套利</h1>
                        </div>

                        <div className="flex flex-1 justify-around items-center px-4">
                            <div className="flex flex-col items-center">
                                <span className={labelText}>幣託 USDT</span>
                                <span className={`${uniformText} ${priceFlash ? 'animate-price-flash' : 'text-white'}`}>
                                    {bitoPrice?.toFixed(2) || '---'}
                                </span>
                            </div>

                            <div className="flex flex-col items-center">
                                <span className={labelText}>溢價</span>
                                <span className={`${uniformText} ${parseFloat(calculations.premium) > 0 ? 'text-green-500' : 'text-red-500'}`}>
                                    {calculations.premium}%
                                </span>
                            </div>

                            <div className="hidden sm:flex flex-col items-center">
                                <span className={labelText}>中價基準</span>
                                <span className={`${uniformText} text-silver-400`}>{calculations.mid.toFixed(3)}</span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 border-l border-white/10 pl-4 text-right">
                           <div className="hidden lg:flex flex-col items-end mr-3">
                              <span className="text-[8px] text-slate-600 font-bold uppercase tracking-tighter">NEXT: {bitoTimer}s</span>
                           </div>
                           <button onClick={() => fetchBotRates()} className="p-1 hover:bg-white/5 rounded-md transition-all active:scale-90">
                             <IconRefresh className={`w-4 h-4 text-slate-600 ${loading ? 'animate-spin text-white' : ''}`} />
                           </button>
                        </div>
                    </section>

                    {/* 參數工具列 */}
                    <section className="bg-[#111] border border-white/10 rounded-lg px-4 py-2 flex items-center justify-between shadow-lg flex-shrink-0">
                        <div className="flex-1 grid grid-cols-4 md:flex md:items-center md:justify-around gap-4 md:gap-8 text-center">
                            
                            <div className="flex flex-col items-center">
                                <span className={labelText}>數量 (USDT)</span>
                                <input 
                                    type="number" value={usdtAmount} 
                                    onChange={e => setUsdtAmount(e.target.value)}
                                    className="bg-black border border-white/10 rounded px-2 py-0.5 text-center text-sm font-bold text-white outline-none focus:border-cyan-500/50 w-24 md:w-32"
                                />
                            </div>

                            <div className="flex flex-col items-center">
                                <span className={labelText}>費率 (%)</span>
                                <input 
                                    type="number" step="0.01" value={feeRate} 
                                    onChange={e => setFeeRate(e.target.value)}
                                    className="bg-black border border-white/10 rounded px-2 py-0.5 text-center text-sm font-bold text-slate-400 outline-none focus:border-cyan-500/50 w-16 md:w-20"
                                />
                            </div>

                            <div className="flex flex-col items-center">
                                <span className={labelText}>台銀買入</span>
                                <span className={uniformText}>{rates.buy}</span>
                            </div>

                            <div className="flex flex-col items-center">
                                <span className={labelText}>台銀賣出</span>
                                <span className={uniformText}>{rates.sell}</span>
                            </div>

                        </div>
                    </section>

                    {/* 主策略矩陣 */}
                    <main className="flex-1 bg-[#111] border border-white/10 rounded-lg overflow-hidden flex flex-col font-mono relative min-h-0 shadow-2xl">
                        
                        <div className="px-5 py-2 bg-white/[0.02] border-b border-white/10 flex items-center justify-center gap-4">
                            <span className={labelText}>策略分析矩陣</span>
                            <span className="text-[9px] text-slate-600 uppercase tracking-tighter">BASE_RETURN: <span className="text-white font-bold underline text-sm">{Math.round(calculations.baseNet).toLocaleString()} TWD</span></span>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            <table className="w-full border-collapse">
                                <thead className="sticky top-0 bg-[#111] border-b border-white/10 z-10 shadow-md">
                                    <tr className={labelText}>
                                        <th className="py-4 text-center">級距</th>
                                        <th className="py-4 text-center">分批賣出價</th>
                                        <th className="py-4 text-center text-amber-500/80">保本回補點</th>
                                        <th className="py-4 text-center text-slate-300">預估實收</th>
                                        <th className="py-4 text-center text-cyan-400">套利收益</th>
                                        <th className="py-4 text-center px-2">指令</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/[0.03]">
                                    {calculations.levels.map((level, i) => (
                                        <tr key={i} className="hover:bg-white/[0.02] group transition-all duration-300">
                                            <td className={`py-4 text-center ${uniformText} text-silver-300 font-black`}>{level.label}</td>
                                            <td className={`py-4 text-center text-white ${uniformText}`}>{level.sellPrice}</td>
                                            <td className={`py-4 text-center text-amber-500/90 ${uniformText} italic`}>{level.buyBackPrice}</td>
                                            <td className={`py-4 text-center text-slate-400 ${uniformText}`}>{level.netTwd}</td>
                                            <td className={`py-4 text-center text-cyan-400 ${uniformText}`}>+{level.profit}</td>
                                            <td className="py-4 text-center">
                                                <button 
                                                    onClick={() => handleCopy(level.sellPrice)}
                                                    className={`px-3 py-1 rounded border text-sm font-black uppercase transition-all ${
                                                        copyFeedback === level.sellPrice 
                                                        ? 'bg-green-500/20 border-green-500/50 text-green-400' 
                                                        : 'border-white/10 hover:border-white/40 text-slate-600 hover:text-white'
                                                    }`}
                                                >
                                                    {copyFeedback === level.sellPrice ? 'DONE' : 'COPY'}
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    <footer className="text-[9px] text-slate-800 flex justify-between items-center px-1 tracking-widest uppercase font-bold flex-shrink-0">
                        <div className="flex gap-4">
                            <span>V3.4.2 STABLE</span>
                            <span className="opacity-10">|</span>
                            <span>ENDPOINT_SECURED</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full bg-green-900 animate-pulse" />
                            <span>SYNC_ACTIVE</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
