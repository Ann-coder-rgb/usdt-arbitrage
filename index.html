<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匯差套利儀表板 - Bito & MAX</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💵</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        body {
            background-color: black;
            color: #cbd5e1;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.8rem; 
            margin: 0;
            overflow: hidden;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        @keyframes flash-bito {
            0% { opacity: 1; color: #01a1ea; }
            50% { opacity: 0.5; color: #fff; }
            100% { opacity: 1; color: #01a1ea; }
        }
        @keyframes flash-max {
            0% { opacity: 1; color: #2962ff; }
            50% { opacity: 0.5; color: #fff; }
            100% { opacity: 1; color: #2962ff; }
        }
        .animate-bito-flash { animation: flash-bito 0.8s ease-in-out; }
        .animate-max-flash { animation: flash-max 0.8s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useEffect, useMemo, useCallback } = React;

        const IconCpu = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line></svg>
        );
        const IconRefresh = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        );

        const App = () => {
            const [loading, setLoading] = useState(false);
            const [bgSyncing, setBgSyncing] = useState(false);
            const [rates, setRates] = useState({ buy: 31.25, sell: 32.12, updateTime: '--:--' });
            
            const [bitoPrice, setBitoPrice] = useState(null);
            const [maxPrice, setMaxPrice] = useState(null);
            
            const [syncTimer, setSyncTimer] = useState(8); 
            const [usdtAmount, setUsdtAmount] = useState(1000); 
            const [feeRate, setFeeRate] = useState(0.2); 
            
            const [bitoFlash, setBitoFlash] = useState(false);
            const [maxFlash, setMaxFlash] = useState(false);
            const [copyFeedback, setCopyFeedback] = useState(null);

            const apiKey = ""; 

            const fetchWithRetry = async (url, options = {}, retries = 3, backoff = 1000) => {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`Status: ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (retries > 0) {
                        await new Promise(r => setTimeout(r, backoff));
                        return fetchWithRetry(url, options, retries - 1, backoff * 2);
                    }
                    throw err;
                }
            };

            const fetchBotRates = async (isBackground = false) => {
                if (!isBackground) setLoading(true);
                setBgSyncing(true);
                try {
                    const userQuery = "請幫我查詢台灣銀行最新美金現鈔的『買入』與『賣出』匯率數字是多少？";
                    const systemPrompt = "僅回傳 JSON：{\"buy\": 數字, \"sell\": 數字}。";
                    
                    const result = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ "google_search": {} }]
                        })
                    });

                    const textContent = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    const cleanedJsonText = textContent.replace(/```json|```/g, "").trim();
                    const data = JSON.parse(cleanedJsonText);

                    if (data.buy && data.sell) {
                        setRates({ 
                            buy: data.buy, 
                            sell: data.sell, 
                            updateTime: new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' }) 
                        });
                    }
                } catch (err) { 
                    console.error("BOT Sync Failed:", err); 
                } finally { 
                    setLoading(false);
                    setTimeout(() => setBgSyncing(false), 2000);
                }
            };

            const fetchBitoPrice = useCallback(async () => {
                try {
                    const data = await fetchWithRetry('https://api.bitopro.com/v3/tickers/usdt_twd');
                    if (data?.data?.lastPrice) {
                        const newPrice = parseFloat(data.data.lastPrice);
                        if (newPrice !== bitoPrice) {
                            setBitoFlash(true);
                            setTimeout(() => setBitoFlash(false), 800);
                        }
                        setBitoPrice(newPrice);
                    }
                } catch (err) { console.error("Bito Connection Error:", err); }
            }, [bitoPrice]);

            const fetchMaxPrice = useCallback(async () => {
                const targetUrl = 'https://max-api.maicoin.com/api/v2/tickers/usdttwd';
                
                // 代理清單：依序嘗試
                const proxyProviders = [
                    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
                ];

                for (const getProxyUrl of proxyProviders) {
                    try {
                        const response = await fetch(getProxyUrl(targetUrl));
                        if (!response.ok) continue;
                        const data = await response.json();
                        
                        if (data?.last) {
                            const newPrice = parseFloat(data.last);
                            if (newPrice !== maxPrice) {
                                setMaxFlash(true);
                                setTimeout(() => setMaxFlash(false), 800);
                            }
                            setMaxPrice(newPrice);
                            return; // 成功獲取則跳出循環
                        }
                    } catch (err) {
                        console.warn("MAX Proxy Attempt Failed:", err.message);
                    }
                }
                console.error("MAX Price Sync: All proxies failed.");
            }, [maxPrice]);

            const fetchAllExchanges = useCallback(() => {
                fetchBitoPrice();
                fetchMaxPrice();
                setSyncTimer(8);
            }, [fetchBitoPrice, fetchMaxPrice]);

            const calculations = useMemo(() => {
                const mid = (parseFloat(rates.buy) + parseFloat(rates.sell)) / 2;
                const amount = parseFloat(usdtAmount) || 0;
                const feeDecimal = (parseFloat(feeRate) || 0) / 100;
                const baseNet = (mid * amount) * (1 - feeDecimal);

                const levels = [1.01, 1.02, 1.03, 1.04, 1.05, 1.06].map(m => {
                    const targetSellPrice = mid * m;
                    const netTwdFromSell = (targetSellPrice * amount) * (1 - feeDecimal);
                    const breakEvenBuyPrice = targetSellPrice * (1 - feeDecimal) / (1 + feeDecimal);
                    const extraProfit = netTwdFromSell - baseNet;

                    return {
                        label: `${(m * 100 - 100).toFixed(0)}%`,
                        sellPrice: targetSellPrice.toFixed(4),
                        buyBackPrice: breakEvenBuyPrice.toFixed(4),
                        netTwd: Math.round(netTwdFromSell).toLocaleString(),
                        profit: Math.round(extraProfit).toLocaleString()
                    };
                });

                const bitoPremium = bitoPrice ? (((bitoPrice / mid) - 1) * 100).toFixed(2) : '--';
                const maxPremium = maxPrice ? (((maxPrice / mid) - 1) * 100).toFixed(2) : '--';
                
                return { mid, levels, baseNet, bitoPremium, maxPremium };
            }, [rates, usdtAmount, feeRate, bitoPrice, maxPrice]);

            useEffect(() => {
                fetchBotRates();
                fetchAllExchanges();
                const exchangeInterval = setInterval(fetchAllExchanges, 8000);
                const botInterval = setInterval(() => fetchBotRates(true), 120000);
                const countdown = setInterval(() => setSyncTimer(prev => prev > 0 ? prev - 1 : 0), 1000);
                return () => {
                    clearInterval(exchangeInterval);
                    clearInterval(botInterval);
                    clearInterval(countdown);
                };
            }, [fetchAllExchanges]);

            const handleCopy = (val) => {
                const el = document.createElement('textarea');
                el.value = val;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopyFeedback(val);
                setTimeout(() => setCopyFeedback(null), 1000);
            };

            const uniformText = "text-sm font-bold tracking-tight transition-all duration-500 text-center"; 
            const labelText = "text-[10px] md:text-[11px] font-bold text-slate-500 uppercase tracking-widest leading-relaxed text-center"; 

            return (
                <div className="h-screen bg-black text-slate-300 font-mono overflow-hidden p-2 flex flex-col gap-2 selection:bg-silver-500/30">
                    
                    {/* 頂部看板區域 */}
                    <section className="bg-[#111] border border-white/10 rounded-lg p-2 md:p-3 flex items-center justify-between shadow-2xl relative overflow-hidden flex-shrink-0">
                        <div className="absolute bottom-0 left-0 h-[1px] bg-cyan-900 transition-all duration-1000" style={{ width: `${(syncTimer/8)*100}%` }} />
                        
                        <div className="flex items-center gap-3 border-r border-white/10 pr-4 md:pr-6">
                            <IconCpu className={`w-4 h-4 md:w-5 md:h-5 ${bgSyncing ? 'text-cyan-400' : 'text-slate-500'} transition-colors duration-700`} />
                            <h1 className="text-xs md:text-base font-bold tracking-[0.1em] text-white whitespace-nowrap">ARBITRAGE</h1>
                        </div>

                        <div className="flex flex-1 justify-around items-center px-2 md:px-4 gap-2">
                            {/* BitoPro */}
                            <div className="flex flex-col items-center">
                                <span className={labelText}>BITOPRO USDT</span>
                                <span className={`${uniformText} ${bitoFlash ? 'animate-bito-flash' : 'text-[#01a1ea]'}`}>
                                    {bitoPrice?.toFixed(2) || '---'}
                                </span>
                                <span className={`text-[10px] font-bold ${parseFloat(calculations.bitoPremium) > 0 ? 'text-green-500' : 'text-red-500'}`}>
                                    {calculations.bitoPremium}%
                                </span>
                            </div>

                            {/* MAX */}
                            <div className="flex flex-col items-center">
                                <span className={labelText}>MAX USDT</span>
                                <span className={`${uniformText} ${maxFlash ? 'animate-max-flash' : 'text-[#2962ff]'}`}>
                                    {maxPrice?.toFixed(2) || '---'}
                                </span>
                                <span className={`text-[10px] font-bold ${parseFloat(calculations.maxPremium) > 0 ? 'text-green-500' : 'text-red-500'}`}>
                                    {calculations.maxPremium}%
                                </span>
                            </div>

                            <div className="hidden sm:flex flex-col items-center border-l border-white/5 pl-4">
                                <span className={labelText}>台銀中價</span>
                                <span className={`${uniformText} text-slate-400`}>{calculations.mid.toFixed(3)}</span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 border-l border-white/10 pl-4 text-right">
                            <div className="hidden lg:flex flex-col items-end mr-3">
                                <span className="text-[8px] text-slate-600 font-bold uppercase tracking-tighter">REFRESH: {syncTimer}s</span>
                            </div>
                            <button onClick={() => fetchBotRates()} className="p-1 hover:bg-white/5 rounded-md transition-all active:scale-90">
                                <IconRefresh className={`w-4 h-4 text-slate-600 ${loading ? 'animate-spin text-white' : ''}`} />
                            </button>
                        </div>
                    </section>

                    {/* 參數工具列 */}
                    <section className="bg-[#111] border border-white/10 rounded-lg px-4 py-2 flex items-center justify-between shadow-lg flex-shrink-0">
                        <div className="flex-1 grid grid-cols-4 md:flex md:items-center md:justify-around gap-4 md:gap-8 text-center">
                            
                            <div className="flex flex-col items-center">
                                <span className={labelText}>數量 (USDT)</span>
                                <input 
                                    type="number" value={usdtAmount} 
                                    onChange={e => setUsdtAmount(e.target.value)}
                                    className="bg-black border border-white/10 rounded px-2 py-0.5 text-center text-sm font-bold text-white outline-none focus:border-cyan-500/50 w-24 md:w-32"
                                />
                            </div>

                            <div className="flex flex-col items-center">
                                <span className={labelText}>費率 (%)</span>
                                <input 
                                    type="number" step="0.01" value={feeRate} 
                                    onChange={e => setFeeRate(e.target.value)}
                                    className="bg-black border border-white/10 rounded px-2 py-0.5 text-center text-sm font-bold text-slate-400 outline-none focus:border-cyan-500/50 w-16 md:w-20"
                                />
                            </div>

                            <div className="flex flex-col items-center">
                                <span className={labelText}>台銀買入</span>
                                <span className={uniformText}>{rates.buy}</span>
                            </div>

                            <div className="flex flex-col items-center">
                                <span className={labelText}>台銀賣出</span>
                                <span className={uniformText}>{rates.sell}</span>
                            </div>

                        </div>
                    </section>

                    {/* 主策略矩陣 */}
                    <main className="flex-1 bg-[#111] border border-white/10 rounded-lg overflow-hidden flex flex-col font-mono relative min-h-0 shadow-2xl">
                        <div className="px-5 py-2 bg-white/[0.02] border-b border-white/10 flex items-center justify-center">
                            <span className={labelText}>策略分析矩陣 (對比台銀基準)</span>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto custom-scrollbar">
                            <table className="w-full border-collapse">
                                <thead className="sticky top-0 bg-[#111] border-b border-white/10 z-10 shadow-md">
                                    <tr className={labelText}>
                                        <th className="py-4 text-center">級距</th>
                                        <th className="py-4 text-center">分批賣出價</th>
                                        <th className="py-4 text-center text-amber-500/80">保本回補點</th>
                                        <th className="py-4 text-center text-slate-300">預估實收</th>
                                        <th className="py-4 text-center text-cyan-400">套利收益</th>
                                        <th className="py-4 text-center px-2">指令</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/[0.03]">
                                    {calculations.levels.map((level, i) => (
                                        <tr key={i} className="hover:bg-white/[0.02] group transition-all duration-300">
                                            <td className={`py-2 text-center ${uniformText} text-silver-300 font-black`}>{level.label}</td>
                                            <td className={`py-2 text-center text-white ${uniformText}`}>{level.sellPrice}</td>
                                            <td className={`py-2 text-center text-amber-500/90 ${uniformText}`}>{level.buyBackPrice}</td>
                                            <td className={`py-2 text-center text-slate-400 ${uniformText}`}>{level.netTwd}</td>
                                            <td className={`py-2 text-center text-cyan-400 ${uniformText}`}>+{level.profit}</td>
                                            <td className="py-2 text-center">
                                                <button 
                                                    onClick={() => handleCopy(level.sellPrice)}
                                                    className={`px-3 py-1 rounded border text-[10px] font-black uppercase transition-all ${
                                                        copyFeedback === level.sellPrice 
                                                        ? 'bg-green-500/20 border-green-500/50 text-green-400' 
                                                        : 'border-white/10 hover:border-white/40 text-slate-600 hover:text-white'
                                                    }`}
                                                >
                                                    {copyFeedback === level.sellPrice ? 'DONE' : 'COPY'}
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </main>

                    <footer className="text-[9px] text-slate-800 flex justify-between items-center px-1 tracking-widest uppercase font-bold flex-shrink-0">
                        <div className="flex gap-4">
                            <span>V3.5.3 STABLE</span>
                            <span className="opacity-10">|</span>
                            <span>MULTI_PROXY_FAILOVER_ACTIVE</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full bg-green-900 animate-pulse" />
                            <span>DATA_FEED_ACTIVE</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
